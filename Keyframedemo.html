<!DOCTYPE html>
<html>
<head>
<style>
@keyframes blackToBlue {
    from {background-color: black;}
    to {background-color: blue;}
}

/* Standard syntax */
body {
    width: 100%;
    height: 100%;
    background-color: black;
    animation-name: blackToBlue;
    animation-duration: 4s;
    /*
    animation-direction values are
    normal - play forward and resets to start over
    reverse - plays backwards and resets to end state
    alternate - reverses direction each cycle, first is forward
    alternate-reverse - reverses direction each cycle, first is backwards
    */
    animation-direction: alternate-reverse;
    animation-iteration-count: infinite;
}
</style>
</head>
<body>


</body>
</html>
